<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width">
		<title>Seren Alert</title>
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap">
		<style>
			/* styled after the RS3 game interfaces */
			html, body { height: 100%; }
			body { margin: 0; display: flex; flex-direction: column; background: #0c1418; color: #e8e8e8; font: 12px/1.35 Arial, Helvetica, sans-serif; border: 1px solid #3e3424; box-sizing: border-box; }
			a { color: #e8c26e; }
			#header { display: flex; align-items: center; gap: 6px; padding: 5px 8px; background: linear-gradient(#2a241b, #16130e); border-bottom: 1px solid #5c4b2e; }
			#header .icon { color: #e8c26e; font-size: 15px; }
			#header h1 { margin: 0; font: 700 14px Cinzel, Georgia, serif; letter-spacing: 1px; text-transform: uppercase; color: #e8c26e; text-shadow: 1px 1px 0 #000; }
			main { flex: 1; overflow-y: auto; padding: 6px 8px; }
			#status { color: #ff9a3c; margin-bottom: 6px; }
			#status.ok { color: #5cd65c; }
			#alert { background: #4cd964; color: #1e1a10; font-weight: bold; font-size: 15px; text-align: center; padding: 6px; border: 1px solid #000; outline: 1px solid #5c4b2e; margin: 2px 1px 8px; transition: background-color 0.5s; }
			#alert-time { display: block; font-size: 28px; line-height: 1.1; }
			#alert-bar { height: 8px; background: rgba(0, 0, 0, 0.3); margin-top: 4px; overflow: hidden; }
			#alert-fill { height: 100%; background: #fff; transition: width 1s linear; }
			#stats { display: grid; grid-template-columns: repeat(4, 1fr); column-gap: 4px; padding-bottom: 6px; margin-bottom: 4px; border-bottom: 1px solid #2c3438; }
			.label, .head td { color: #c8b48a; }
			.value { font-size: 13px; }
			h3 { font: 700 11px Cinzel, Georgia, serif; letter-spacing: 1px; text-transform: uppercase; color: #c8b48a; margin: 8px 0 3px; }
			table { width: 100%; border-collapse: collapse; }
			td { padding: 2px 3px; }
			tr + tr td { border-top: 1px solid #1c2428; }
			.num { text-align: right; white-space: nowrap; }
			.muted { color: #8a8f8a; }
			ul { list-style: none; margin: 0; padding: 0; }
			li { padding: 1px 3px; }
			#toolbar { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; padding: 5px 6px; background: linear-gradient(#1d1a14, #110f0b); border-top: 1px solid #5c4b2e; }
			button { background: linear-gradient(#3a3226, #221d15); color: #e8c26e; border: 1px solid #7a6440; border-radius: 2px; padding: 3px 7px; font: 11px Arial, sans-serif; cursor: pointer; box-shadow: inset 0 1px 0 rgba(255, 230, 170, 0.15); }
			button:hover { background: linear-gradient(#4a4030, #2c261c); color: #ffe39a; }
			button:active { background: #1a1610; }
			label { color: #c8b48a; display: flex; align-items: center; gap: 2px; }
			input[type=checkbox] { accent-color: #b8913e; margin: 0; }
		</style>
	</head>
	<body>
		<div id="header">
			<span class="icon">✦</span>
			<h1>Seren Alert</h1>
		</div>
		<main>
			<div id="status">Loading...</div>
			<div id="alert" hidden>
				Seren spirit!
				<span id="alert-time"></span>
				<div id="alert-bar"><div id="alert-fill"></div></div>
			</div>
			<div id="stats"></div>
			<h3>Rewards</h3>
			<table id="totals"></table>
			<h3>Recent</h3>
			<ul id="log"></ul>
		</main>
		<div id="toolbar">
			<button onclick="SerenAlert.refind()" title="Re-find the chatbox">Re-find</button>
			<button onclick="SerenAlert.alertSpawn()" title="Play a test alert">Test</button>
			<button onclick="SerenAlert.clearData()">Clear</button>
			<label><input type="checkbox" id="opt-sound" onchange="SerenAlert.toggleSetting('sound', this.checked)">Sound</label>
			<label><input type="checkbox" id="opt-overlay" onchange="SerenAlert.toggleSetting('overlay', this.checked)">Overlay</label>
		</div>
		<script src="./main.js"></script>
	</body>
</html>
